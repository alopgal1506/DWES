<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <title>Mi primera página</title>
</head>
<body>
   {% for colaborador in colaborador_list%}
       <article>
           <h2>Nombre: {{colaborador.nombre}}</h2>
           <p>{{colaborador.text|linebreaks}}</p>
           <time>Published: {{colaborador.fecha_creacion}}</time>
       </article>
   {% endfor%}
</body>
</html>
