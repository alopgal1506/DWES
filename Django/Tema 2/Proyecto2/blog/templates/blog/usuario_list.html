<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Mi primera página</title>
</head>
<body>
    {% for usuario in usuarios_list%}
       <article>
           <h2>Usuario: {{usuario.user}}</h2>
           <p>Nombre: {{usuario.nombre}}</p>
           <p>DNI: {{usuario.dni}}</p>
           <p>Fecha de cración: {{usuario.fecha_creacion}}</p>
       </article>
   {% endfor%}
   <li><a href="{% url 'index' %}">Volver</a></li>
</body>
</html>
