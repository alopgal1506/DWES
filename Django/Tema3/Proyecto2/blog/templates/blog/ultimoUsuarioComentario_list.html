<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tercera página</title>
</head>
<body>
    <h1>Último usuario que ha comentado</h1>

    {% if comentario %}
        <p>Usuario: {{ comentario.usuarios_comentan.nombre }}</p>
        <p>Tarea: {{ comentario.tareas.titulo }}</p>
        <p>Comentario: {{ comentario.contenido }}</p>
        <p>Fecha: {{ comentario.fechaComentario }}</p>
    {% else %}
        <p>No hay comentarios en este proyecto.</p>
    {% endif %}

<ul>
    <li><a href="{% url 'index' %}">Volver</a></li>
</ul>
</body>
</html>
