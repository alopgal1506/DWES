<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tercera página</title>
</head>
<body>
    <h1>Comentarios de una Tarea Concreta</h1>

    {% for comentario in comentarios %}
        <h2>Usuario: {{ comentario.usuarios_comentan.nombre }}</h2>
        <p>Contenido: {{ comentario.contenido }}</p>
        <p>Fecha Comentario: {{ comentario.fechaComentario }}</p>
        <hr>
    {% endfor %}

<ul>
    <li><a href="{% url 'index' %}">Volver</a></li>
</ul>
</body>
</html>
